          <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐋 蓝色大肥鱼接口粮大作战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #0a0e2a 0%, #1a1a4e 50%, #0d1b3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(0,150,255,0.15), inset 0 0 60px rgba(0,100,255,0.05);
            border: 1px solid rgba(100,200,255,0.15);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,100,255,0.2);
            background: #0a0e2a;
            cursor: pointer;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            color: #aac8ff;
            font-size: 16px;
        }
        .game-header .score span {
            color: #ffd700;
            font-size: 22px;
            font-weight: bold;
        }
        .game-header .lives {
            color: #ff6b8a;
            font-size: 20px;
        }
        .game-header .high-score {
            color: #7ec8e3;
            font-size: 14px;
        }
        .game-header .high-score span {
            color: #ffd700;
        }
        .controls-hint {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            text-align: center;
            padding: 8px 0 0 0;
            letter-spacing: 1px;
        }
        .controls-hint kbd {
            background: rgba(255,255,255,0.08);
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
        }
        @media (max-width: 520px) {
            .game-wrapper { padding: 10px; }
            .game-header { font-size: 13px; padding: 6px 10px; }
            .game-header .score span { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-header">
        <div class="score">🐟 口粮: <span id="scoreDisplay">0</span></div>
        <div class="high-score">🏆 最高: <span id="highScoreDisplay">0</span></div>
        <div class="lives" id="livesDisplay">❤️❤️❤️</div>
    </div>
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div class="controls-hint">方向键 <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动 · 按 <kbd>空格</kbd> 开始/重开</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;

let game = {
    score: 0,
    highScore: parseInt(localStorage.getItem('fishGameHighScore')) || 0,
    lives: 3,
    state: 'start', // start, playing, over
    frame: 0,
};

// 鱼
const fish = {
    x: W/2,
    y: H - 70,
    w: 64,
    h: 40,
    speed: 5,
};

// 食物数组
let foods = [];
const foodTypes = [
    { emoji: '🪙', label: 'Token', points: 10, size: 24 },
    { emoji: '🐟', label: '小鱼干', points: 15, size: 26 },
    { emoji: '🍪', label: '饼干', points: 8, size: 22 },
    { emoji: '🧁', label: '蛋糕', points: 20, size: 28 },
    { emoji: '🦐', label: '虾仁', points: 12, size: 24 },
    { emoji: '💎', label: '彩蛋', points: 30, size: 20 },
];

// 气泡特效
let bubbles = [];
let particles = [];

// 键盘
const keys = { left: false, right: false };

// 显示更新
function updateUI() {
    document.getElementById('scoreDisplay').textContent = game.score;
    document.getElementById('highScoreDisplay').textContent = game.highScore;
    const hearts = '❤️'.repeat(Math.max(0, game.lives)) + '🖤'.repeat(Math.max(0, 3 - game.lives));
    document.getElementById('livesDisplay').textContent = hearts || '💀';
}

// 重置游戏
function resetGame() {
    game.score = 0;
    game.lives = 3;
    game.state = 'playing';
    game.frame = 0;
    foods = [];
    bubbles = [];
    particles = [];
    fish.x = W/2;
    updateUI();
}

// 生成食物
function spawnFood() {
    const type = foodTypes[Math.floor(Math.random() * foodTypes.length)];
    const x = 30 + Math.random() * (W - 60);
    const speed = 1.5 + Math.random() * 2.5 + game.score * 0.003;
    foods.push({
        x, y: -20,
        type,
        speed: Math.min(speed, 6),
        size: type.size,
        rotation: 0,
        wobble: Math.random() * Math.PI * 2,
    });
}

// 生成气泡
function addBubble(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
        bubbles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 3 - 1,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            radius: 2 + Math.random() * 4,
            color: color,
        });
    }
}

// 粒子特效
function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 15,
            maxLife: 35,
            radius: 2 + Math.random() * 3,
            color: color,
        });
    }
}

// 绘制鱼
function drawFish() {
    const fx = fish.x, fy = fish.y;

    // 鱼身发光
    const glow = ctx.createRadialGradient(fx, fy, 5, fx, fy, 40);
    glow.addColorStop(0, 'rgba(0,150,255,0.15)');
    glow.addColorStop(1, 'rgba(0,150,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx, fy, 40, 0, Math.PI * 2);
    ctx.fill();

    // 鱼尾（鲸鱼尾鳍）
    ctx.save();
    ctx.translate(fx - 20, fy);
    ctx.fillStyle = '#2a4a7a';
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(-20, -18, -28, -5);
    ctx.quadraticCurveTo(-22, -2, -18, 0);
    ctx.quadraticCurveTo(-22, 2, -28, 5);
    ctx.quadraticCurveTo(-20, 18, 0, 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,200,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 鱼身
    const bodyGrad = ctx.createLinearGradient(fx - 25, fy, fx + 25, fy);
    bodyGrad.addColorStop(0, '#1a3a6a');
    bodyGrad.addColorStop(0.5, '#2a6a9a');
    bodyGrad.addColorStop(1, '#1a3a6a');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(fx, fy, 28, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,200,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 鱼鳍（背鳍）
    ctx.fillStyle = '#1a4a7a';
    ctx.beginPath();
    ctx.moveTo(fx - 5, fy - 16);
    ctx.quadraticCurveTo(fx + 5, fy - 26, fx + 15, fy - 16);
    ctx.closePath();
    ctx.fill();

    // 鱼眼
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(fx + 12, fy - 4, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a2a4a';
    ctx.beginPath();
    ctx.arc(fx + 14, fy - 4, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(fx + 15, fy - 5.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 鱼嘴
    ctx.strokeStyle = '#5a8aaa';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(fx + 24, fy + 2, 4, -0.5, 0.5);
    ctx.stroke();

    // 腮红
    ctx.fillStyle = 'rgba(255,100,150,0.15)';
    ctx.beginPath();
    ctx.ellipse(fx + 8, fy + 6, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
}

// 绘制食物
function drawFood(food) {
    ctx.save();
    ctx.translate(food.x, food.y);
    ctx.font = food.size + 'px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(food.type.emoji, 0, 0);
    ctx.restore();

    // 食物发光
    const glow = ctx.createRadialGradient(food.x, food.y, 2, food.x, food.y, food.size);
    glow.addColorStop(0, 'rgba(255,255,200,0.1)');
    glow.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(food.x, food.y, food.size, 0, Math.PI * 2);
    ctx.fill();
}

// 绘制背景
function drawBackground() {
    // 海底波纹
    ctx.fillStyle = 'rgba(0,50,100,0.05)';
    for (let i = 0; i < 5; i++) {
        const y = H - 20 + Math.sin(game.frame * 0.02 + i) * 5;
        ctx.beginPath();
        ctx.ellipse(W/2, y, W * 0.6, 8, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // 海底光点
    for (let i = 0; i < 8; i++) {
        const x = (i * 67 + 13) % W;
        const y = (i * 89 + 37) % H;
        const r = 1 + Math.sin(game.frame * 0.01 + i) * 0.5;
        ctx.fillStyle = 'rgba(100,200,255,0.05)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 绘制开始界面
function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 标题
    ctx.font = 'bold 36px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,200,0,0.5)';
    ctx.shadowBlur = 20;
    ctx.fillText('🐋 接口粮大作战 🐋', W/2, H/2 - 80);
    ctx.shadowBlur = 0;

    ctx.font = '18px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#aac8ff';
    ctx.fillText('控制大肥鱼接住掉落的食物', W/2, H/2 - 20);

    ctx.font = '16px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#7ec8e3';
    ctx.fillText('🪙 Token +10  🐟 小鱼干 +15  🍪 饼干 +8', W/2, H/2 + 30);
    ctx.fillText('🧁 蛋糕 +20  🦐 虾仁 +12  💎 彩蛋 +30', W/2, H/2 + 58);

    ctx.font = '20px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#fff';
    const pulse = Math.sin(Date.now() * 0.005) * 0.15 + 1;
    ctx.save();
    ctx.translate(W/2, H/2 + 120);
    ctx.scale(pulse, pulse);
    ctx.fillText('按 空格键 开始游戏', 0, 0);
    ctx.restore();

    // 画一条鱼在中间
    const savedX = fish.x, savedY = fish.y;
    fish.x = W/2;
    fish.y = H/2 + 170;
    drawFish();
    fish.x = savedX;
    fish.y = savedY;
}

// 绘制结束界面
function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold 40px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ff6b8a';
    ctx.shadowColor = 'rgba(255,50,50,0.5)';
    ctx.shadowBlur = 20;
    ctx.fillText('💀 游戏结束 💀', W/2, H/2 - 80);
    ctx.shadowBlur = 0;

    ctx.font = '28px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('得分: ' + game.score, W/2, H/2 - 10);

    if (game.score >= game.highScore && game.score > 0) {
        ctx.font = '20px "Segoe UI", "PingFang SC", sans-serif';
        ctx.fillStyle = '#ff6b8a';
        ctx.shadowColor = 'rgba(255,100,100,0.3)';
        ctx.shadowBlur = 10;
        ctx.fillText('🎉 新纪录！🎉', W/2, H/2 + 40);
        ctx.shadowBlur = 0;
    }

    ctx.font = '18px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#aac8ff';
    ctx.fillText('最高分: ' + game.highScore, W/2, H/2 + 85);

    const pulse = Math.sin(Date.now() * 0.005) * 0.15 + 1;
    ctx.save();
    ctx.translate(W/2, H/2 + 140);
    ctx.scale(pulse, pulse);
    ctx.font = '18px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('按 空格键 再来一局', 0, 0);
    ctx.restore();
}

// 更新
function update() {
    if (game.state !== 'playing') return;
    game.frame++;

    // 鱼移动
    if (keys.left) fish.x = Math.max(30, fish.x - fish.speed);
    if (keys.right) fish.x = Math.min(W - 30, fish.x + fish.speed);

    // 生成食物 - 随分数增加频率
    const spawnRate = Math.max(10, 30 - Math.floor(game.score / 10));
    if (game.frame % spawnRate === 0) {
        spawnFood();
    }

    // 更新食物
    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        f.y += f.speed;
        f.wobble += 0.05;
        f.x += Math.sin(f.wobble) * 0.3;

        // 碰撞检测
        const dx = fish.x - f.x;
        const dy = fish.y - f.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 35) {
            // 接住！
            game.score += f.type.points;
            addParticles(f.x, f.y, '#ffd700', 12);
            addBubble(f.x, f.y, 'rgba(100,200,255,0.3)', 6);
            foods.splice(i, 1);
            updateUI();
            continue;
        }

        // 掉到底部
        if (f.y > H + 20) {
            foods.splice(i, 1);
            game.lives--;
            addBubble(f.x, H - 20, 'rgba(255,50,50,0.3)', 8);
            updateUI();
            if (game.lives <= 0) {
                game.state = 'over';
                if (game.score > game.highScore) {
                    game.highScore = game.score;
                    localStorage.setItem('fishGameHighScore', game.highScore);
                }
                updateUI();
            }
        }
    }

    // 更新气泡
    for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0) { bubbles.splice(i, 1); }
    }

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
        if (p.life <= 0) { particles.splice(i, 1); }
    }
}

// 绘制
function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景渐变
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0e2a');
    bgGrad.addColorStop(0.5, '#0d1b3e');
    bgGrad.addColorStop(1, '#0a1230');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    drawBackground();

    // 绘制食物
    for (const f of foods) {
        drawFood(f);
    }

    // 绘制气泡
    for (const b of bubbles) {
        const alpha = b.life / b.maxLife;
        ctx.fillStyle = b.color.replace('0.3', alpha * 0.3);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
    }

    // 绘制粒子
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 绘制鱼
    drawFish();

    // 分数显示在画布上（额外）
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 16px "Segoe UI", "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillText('🐋 蓝色大肥鱼', 12, 12);

    // 状态界面
    if (game.state === 'start') drawStartScreen();
    if (game.state === 'over') drawGameOver();
}

// 游戏循环
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 键盘事件
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
        e.preventDefault();
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
        e.preventDefault();
    }
    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        if (game.state === 'start') resetGame();
        else if (game.state === 'over') resetGame();
    }
});

document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// 触屏支持
let touchX = null;
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    touchX = (e.touches[0].clientX - rect.left) * scaleX;

    if (game.state === 'start' || game.state === 'over') {
        if (game.state === 'start') resetGame();
        else if (game.state === 'over') resetGame();
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (game.state !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    touchX = (e.touches[0].clientX - rect.left) * scaleX;
    fish.x = Math.max(30, Math.min(W - 30, touchX));
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchX = null;
});

// 鼠标支持
canvas.addEventListener('mousemove', (e) => {
    if (game.state !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    fish.x = Math.max(30, Math.min(W - 30, mx));
});

canvas.addEventListener('click', (e) => {
    if (game.state === 'start') resetGame();
    else if (game.state === 'over') resetGame();
});

// 初始化
updateUI();
gameLoop();
</script>
