 class="variable language_">document</span>.<span class="title function_">getElementById</span>(<span class="string">&#x27;completionList&#x27;</span>);</span></span><br><span class="line"><span class="language-javascript">  <span class="comment">// 1. 定义补全词库（示例：JavaScript 常用 API）</span></span></span><br><span class="line"><span class="language-javascript">  <span class="keyword">const</span> keywordMap = &#123;</span></span><br><span class="line"><span class="language-javascript">    <span class="string">&quot;console.&quot;</span>: [<span class="string">&quot;log()&quot;</span>, <span class="string">&quot;warn()&quot;</span>, <span class="string">&quot;error()&quot;</span>, <span class="string">&quot;table()&quot;</span>],</span></span><br><span class="line"><span class="language-javascript">    <span class="string">&quot;document.&quot;</span>: [<span class="string">&quot;getElementById()&quot;</span>, <span class="string">&quot;querySelector()&quot;</span>, <span class="string">&quot;createElement()&quot;</span>]</span></span><br><span class="line"><span class="language-javascript">  &#125;;</span></span><br><span class="line"><span class="language-javascript"></span></span><br><span class="line"><span class="language-javascript">  <span class="comment">// 2. 监听输入事件，触发补全检测</span></span></span><br><span class="line"><span class="language-javascript">  editor.<span class="title function_">addEventListener</span>(<span class="string">&#x27;input&#x27;</span>, <span class="function">(<span class="params">e</span>) =&gt;</span> &#123;</span></span><br><span class="line"><span class="language-javascript">    <span class="keyword">const</span> cursorPos = editor.<span class="property">selectionStart</span>;</span></span><br><span class="line"><span class="language-javascript">    <span class="keyword">const</span> content = editor.<span class="property">value</span>.<span class="title function_">substring</span>(<span class="number">0</span>, cursorPos);</span></span><br><span class="line"><span class="language-javascript">    <span class="comment">// 匹配词库中的触发前缀（如 console.）</span></span></span><br><span class="line"><span class="language-javascript">    <span class="keyword">const</span> triggerPrefix = <span class="title class_">Object</span>.<span class="title function_">keys</span>(keywordMap).<span class="title function_">find</span>(<span class="function"><span class="params">prefix</span> =&gt;</span> content.<span class="title function_">endsWith</span>(prefix));</span></span><br><span class="line"><span class="language-javascript"></span></span><br><span class="line"><span class="language-javascript">    <span class="keyword">if</span> (triggerPrefix) &#123;</span></span><br><span class="line"><span class="language-javascript">      <span class="title function_">showCompletions</span>(keywordMap[triggerPrefix]);</span></span><br><span class="line"><span class="language-javascript">      <span class="comment">// 定位弹窗到光标下方</span></span></span><br><span class="line"><span class="language-javascript">      <span class="keyword">const</span> rect = editor.<span class="title function_">getBoundingClientRect</span>();</span></span><br><span class="line"><span class="language-javascript">      <span class="variable language_">console</span>.<span class="title function_">log</span>(rect)</span></span><br><span class="line"><span class="language-javascript">      completionList.<span class="property">style</span>.<span class="property">left</span> = <span class="string">`<span class="subst">$&#123;rect.left&#125;</span>px`</span>;</span></span><br><span class="line"><span class="language-javascript">      completionList.<span class="property">style</span>.<span class="property">top</span> = <span class="string">`<span class="subst">$&#123;rect.top + rect.height + <span class="number">5</span>&#125;</span>px`</span>;</span></span><br><span class="line"><span class="language-javascript">    &#125; <span class="keyword">else</span> &#123;</span></span><br><span class="line"><span class="language-javascript">      completionList.<span class="property">style</span>.<span class="property">display</span> = <span class="string">&#x27;none&#x27;</span>; <span class="comment">// 无匹配则隐藏</span></span></span><br><span class="line"><span class="language-javascript">    &#125;</span></span><br><span class="line"><span class="language-javascript">  &#125;);</span></span><br><span class="line"><span class="language-javascript"></span></span><br><span class="line"><span class="language-javascript">  <span class="comment">// 3. 渲染补全候选列表</span></span></span><br><span class="line"><span class="language-javascript">  <span class="keyword">function</span> <span class="title function_">showCompletions</span>(<span class="params">candidates</span>) &#123;</span></span><br><span class="line"><span class="language-javascript">    completionList.<span class="property">innerHTML</span> = candidates.<span class="title function_">map</span>(<span class="function"><span class="params">word</span> =&gt;</span> <span class="string">`&lt;div class=&quot;item&quot;&gt;<span class="subst">$&#123;word&#125;</span>&lt;/div&gt;`</span>).<span class="title function_">join</span>(<span class="string">&#x27;&#x27;</span>);</span></span><br><span class="line"><span class="language-javascript">    completionList.<span class="property">style</span>.<span class="property">display</span> = <span class="string">&#x27;block&#x27;</span>;</span></span><br><span class="line"><span class="language-javascript">    <span class="comment">// 点击候选词插入到编辑区</span></span></span><br><span class="line"><span class="language-javascript">    <span class="variable language_">document</span>.<span class="title function_">querySelectorAll</span>(<span class="string">&#x27;.item&#x27;</span>).<span class="title function_">forEach</span>(<span class="function"><span class="params">item</span> =&gt;</span> &#123;</span></span><br><span class="line"><span class="language-javascript">      item.<span class="title function_">addEventListener</span>(<span class="string">&#x27;click&#x27;</span>, <span class="function">() =&gt;</span> &#123;</span></span><br><span class="line"><span class="language-javascript">        <span class="keyword">const</span> triggerPrefix = <span class="title class_">Object</span>.<span class="title function_">keys</span>(keywordMap).<span class="title function_">find</span>(<span class="function"><span class="params">prefix</span> =&gt;</span> editor.<span class="property">value</span>.<span class="title function_">endsWith</span>(prefix));</span></span><br><span class="line"><span class="language-javascript">        editor.<span class="property">value</span> = editor.<span class="property">value</span>.<span class="title function_">replace</span>(triggerPrefix, triggerPrefix + item.<span class="property">textContent</span>.<span class="title function_">slice</span>(<span class="number">0</span>, -<span class="number">2</span>));</span></span><br><span class="line"><span class="language-javascript">        editor.<span class="title function_">focus</span>();</span></span><br><span class="line"><span class="language-javascript">        completionList.<span class="property">style</span>.<span class="property">display</span> = <span class="string">&#x27;none&#x27;</span>;</span></span><br><span class="line"><span class="language-javascript">      &#125;);</span></span><br><span class="line"><span class="language-javascript">    &#125;);</span></span><br><span class="line"><span class="language-javascript">  &#125;</span></span><br><span class="line"><span class="language-javascript"></span></span><br><span class="line"><span class="language-javascript">  <span class="comment">// 4. 点击空白处关闭补全弹窗</span></span></span><br><span class="line"><span class="language-javascript">  <span class="variable language_">document</span>.<span class="title function_">addEventListener</span>(<span class="string">&#x27;click&#x27;</span>, <span class="function">(<span class="params">e</span>) =&gt;</span> &#123;</span></span><br><span class="line"><span class="language-javascript">    <span class="keyword">if</span> (![editor, completionList].<span class="title function_">includes</span>(e.<span class="property">target</span>)) &#123;</span></span><br><span class="line"><span class="language-javascript">      completionList.<span class="property">style</span>.<span class="property">display</span> = <span class="string">&#x27;none&#x27;</span>;</span></span><br><span class="line"><span class="language-javascript">    &#125;</span></span><br><span class="line"><span class="language-javascript">  &#125;);</span></span><br><span class="line"><span class="language-javascript"></span></span><br><span class="line"><span class="language-javascript"></span><span class="tag">&lt;/<span class="name">script</span>&gt;</span></span><br></pre></td></tr></table></figure>
