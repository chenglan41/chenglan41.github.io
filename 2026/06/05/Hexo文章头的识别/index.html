lass="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">/**</span></span><br><span class="line"><span class="comment"> * 解析 Hexo Front-Matter YAML 字符串为 JavaScript 对象</span></span><br><span class="line"><span class="comment"> * 严格遵循 Hexo 官方 Front-Matter 规范</span></span><br><span class="line"><span class="comment"> * <span class="doctag">@param</span> &#123;<span class="type">string</span>&#125; <span class="variable">yamlStr</span> - 纯 YAML 字符串（不含 --- 分隔符）</span></span><br><span class="line"><span class="comment"> * <span class="doctag">@returns</span> &#123;<span class="type">object</span>&#125; 解析后的 JS 对象</span></span><br><span class="line"><span class="comment"> */</span></span><br><span class="line"><span class="keyword">function</span> <span class="title function_">hexoFrontMatterToJSON</span>(<span class="params">yamlStr</span>) &#123;</span><br><span class="line">  <span class="comment">// 处理空值</span></span><br><span class="line">  <span class="keyword">if</span> (!yamlStr || <span class="keyword">typeof</span> yamlStr !== <span class="string">&#x27;string&#x27;</span>) &#123;</span><br><span class="line">    <span class="keyword">return</span> &#123;&#125;;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">const</span> result = &#123;&#125;;</span><br><span class="line">  <span class="comment">// 按行拆分，过滤空行、注释行</span></span><br><span class="line">  <span class="keyword">const</span> lines = yamlStr</span><br><span class="line">    .<span class="title function_">split</span>(<span class="regexp">/\r?\n/</span>)</span><br><span class="line">    .<span class="title function_">map</span>(<span class="function"><span class="params">line</span> =&gt;</span> line.<span class="title function_">trimEnd</span>()) <span class="comment">// 保留行前缩进，只去掉末尾空格</span></span><br><span class="line">    .<span class="title function_">filter</span>(<span class="function"><span class="params">line</span> =&gt;</span> &#123;</span><br><span class="line">      <span class="keyword">const</span> trimmed = line.<span class="title function_">trim</span>();</span><br><span class="line">      <span class="keyword">return</span> trimmed !== <span class="string">&#x27;&#x27;</span> &amp;&amp; !trimmed.<span class="title function_">startsWith</span>(<span class="string">&#x27;#&#x27;</span>);</span><br><span class="line">    &#125;);</span><br><span class="line"></span><br><span class="line">  <span class="keyword">let</span> currentKey = <span class="literal">null</span>;</span><br><span class="line">  <span class="keyword">let</span> currentIndent = <span class="number">0</span>;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">for</span> (<span class="keyword">const</span> line <span class="keyword">of</span> lines) &#123;</span><br><span class="line">    <span class="comment">// 匹配缩进（用于多行/数组）</span></span><br><span class="line">    <span class="keyword">const</span> indentMatch = line.<span class="title function_">match</span>(<span class="regexp">/^(\s+)/</span>);</span><br><span class="line">    <span class="keyword">const</span> indent = indentMatch ? indentMatch[<span class="number">1</span>].<span class="property">length</span> : <span class="number">0</span>;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// 匹配 key: value 格式</span></span><br><span class="line">    <span class="keyword">const</span> keyValueMatch = line.<span class="title function_">match</span>(<span class="regexp">/^\s*([^:#]+?)\s*:\s*(.*)/</span>);</span><br><span class="line"></span><br><span class="line">    <span class="keyword">if</span> (keyValueMatch) &#123;</span><br><span class="line">      <span class="keyword">const</span> key = keyValueMatch[<span class="number">1</span>].<span class="title function_">trim</span>();</span><br><span class="line">      <span class="keyword">let</span> value = keyValueMatch[<span class="number">2</span>].<span class="title function_">trim</span>();</span><br><span class="line"></span><br><span class="line">      <span class="comment">// —————————————————— 类型解析 ——————————————————</span></span><br><span class="line">      <span class="comment">// 布尔值</span></span><br><span class="line">      <span class="keyword">if</span> (value === <span class="string">&#x27;true&#x27;</span> || value === <span class="string">&#x27;false&#x27;</span>) &#123;</span><br><span class="line">        value = value === <span class="string">&#x27;true&#x27;</span>;</span><br><span class="line">      &#125;</span><br><span class="line">      <span class="comment">// 数字</span></span><br><span class="line">      <span class="keyword">else</span> <span class="keyword">if</span> (!<span class="built_in">isNaN</span>(value) &amp;&amp; value !== <span class="string">&#x27;&#x27;</span>) &#123;</span><br><span class="line">        value = <span class="title class_">Number</span>(value);</span><br><span class="line">      &#125;</span><br><span class="line">      <span class="comment">// 空值</span></span><br><span class="line">      <span class="keyword">else</span> <span class="keyword">if</span> (value === <span class="string">&#x27;&#x27;</span> || value === <span class="string">&#x27;null&#x27;</span>) &#123;</span><br><span class="line">        value = <span class="literal">null</span>;</span><br><span class="line">      &#125;</span><br><span class="line">      <span class="comment">// 字符串（带引号自动去除）</span></span><br><span class="line">      <span class="keyword">else</span> &#123;</span><br><span class="line">        value = value.<span class="title function_">replace</span>(<span class="regexp">/^[&quot;&#x27;]|[&quot;&#x27;]$/g</span>, <span class="string">&#x27;&#x27;</span>);</span><br><span class="line">      &#125;</span><br><span class="line"></span><br><span class="line">      result[key] = value;</span><br><span class="line">      currentKey = key;</span><br><span class="line">      currentIndent = indent;</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// —————————————————— 数组解析（- 开头）——————————————————</span></span><br><span class="line">    <span class="keyword">else</span> <span class="keyword">if</span> (line.<span class="title function_">trim</span>().<span class="title function_">startsWith</span>(<span class="string">&#x27;-&#x27;</span>)) &#123;</span><br><span class="line">      <span class="keyword">const</span> arrayValue = line.<span class="title function_">replace</span>(<span class="regexp">/^\s*-\s*/</span>, <span class="string">&#x27;&#x27;</span>).<span class="title function_">replace</span>(<span class="regexp">/^[&quot;&#x27;]|[&quot;&#x27;]$/g</span>, <span class="string">&#x27;&#x27;</span>);</span><br><span class="line">      </span><br><span class="line">      <span class="keyword">if</span> (!<span class="title class_">Array</span>.<span class="title function_">isArray</span>(result[currentKey])) &#123;</span><br><span class="line">        result[currentKey] = [];</span><br><span class="line">      &#125;</span><br><span class="line">      result[currentKey].<span class="title function_">push</span>(arrayValue);</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    <span class="comment">// —————————————————— 多行文本解析（缩进 &gt; 当前）——————————————————</span></span><br><span class="line">    <span class="keyword">else</span> <span class="keyword">if</span> (indent &gt; currentIndent &amp;&amp; currentKey) &#123;</span><br><span class="line">      <span class="keyword">const</span> text = line.<span class="title function_">trim</span>();</span><br><span class="line">      <span class="keyword">if</span> (text) &#123;</span><br><span class="line">        result[currentKey] = (result[currentKey] || <span class="string">&#x27;&#x27;</span>) + <span class="string">&#x27; &#x27;</span> + text;</span><br><span class="line">      &#125;</span><br><span class="line">    &#125;</span><br><span class="line">  &#125;</span><br><span class="line"></span><br><span class="line">  <span class="keyword">return</span> result;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
