an>);</span><br><span class="line">		<span class="keyword">if</span>(i &gt; <span class="number">0</span>)&#123;</span><br><span class="line">			cr[i<span class="number">-1</span>] += cr[i]/<span class="number">10</span>;</span><br><span class="line">			cr[i] = cr[i]%<span class="number">10</span>;</span><br><span class="line">		&#125;</span><br><span class="line">	&#125;</span><br><span class="line">	<span class="type">int</span> f = <span class="number">0</span>;</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i = <span class="number">0</span>;i&lt;a.<span class="built_in">size</span>();i++)&#123;</span><br><span class="line">		<span class="keyword">if</span>(f == <span class="number">0</span> &amp;&amp; cr[i] != <span class="number">0</span>)f = <span class="number">1</span>;</span><br><span class="line">		<span class="keyword">if</span>(f == <span class="number">1</span>)&#123;</span><br><span class="line">            <span class="keyword">if</span>(i == <span class="number">0</span> &amp;&amp; cr[i] &gt;= <span class="number">10</span>)&#123;</span><br><span class="line">                res += cr[i] / <span class="number">10</span> + <span class="string">&#x27;0&#x27;</span>;</span><br><span class="line">                cr[i] = cr[i] % <span class="number">10</span>;</span><br><span class="line">            &#125; </span><br><span class="line">            res += cr[i] + <span class="string">&#x27;0&#x27;</span>;</span><br><span class="line">        &#125;</span><br><span class="line">	&#125;</span><br><span class="line">	<span class="keyword">if</span>(f == <span class="number">0</span>)<span class="keyword">return</span> <span class="string">&quot;0&quot;</span>;</span><br><span class="line">	<span class="keyword">return</span> res;</span><br><span class="line">&#125;</span><br><span class="line"><span class="function">string <span class="title">smallMulti</span><span class="params">(string a,<span class="type">int</span> b)</span></span>&#123;</span><br><span class="line">	<span class="type">int</span> cr[<span class="number">4001</span>];</span><br><span class="line">	string res = <span class="string">&quot;&quot;</span>;</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i = <span class="number">0</span>;i&lt;<span class="number">4001</span>;i++)</span><br><span class="line">		cr[i] = <span class="number">0</span>;</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i = a.<span class="built_in">size</span>()<span class="number">-1</span>;i&gt;=<span class="number">0</span>;i--)&#123;</span><br><span class="line">		cr[i] += (a[i]-<span class="string">&#x27;0&#x27;</span>)*b;</span><br><span class="line">		<span class="keyword">if</span>(i &gt; <span class="number">0</span>)&#123;</span><br><span class="line">			cr[i<span class="number">-1</span>] += cr[i]/<span class="number">10</span>;</span><br><span class="line">			cr[i] = cr[i]%<span class="number">10</span>;</span><br><span class="line">		&#125;</span><br><span class="line">	&#125;</span><br><span class="line">	<span class="type">int</span> f = <span class="number">0</span>;</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i = <span class="number">0</span>;i&lt;a.<span class="built_in">size</span>();i++)&#123;</span><br><span class="line">		<span class="keyword">if</span>(f == <span class="number">0</span> &amp;&amp; cr[i] != <span class="number">0</span>)f = <span class="number">1</span>;</span><br><span class="line">		<span class="keyword">if</span>(f == <span class="number">1</span>)&#123;</span><br><span class="line">            <span class="keyword">if</span>(i == <span class="number">0</span> &amp;&amp; cr[i] &gt;= <span class="number">10</span>)&#123;</span><br><span class="line">                res += cr[i] / <span class="number">10</span> + <span class="string">&#x27;0&#x27;</span>;</span><br><span class="line">                cr[i] = cr[i] % <span class="number">10</span>;</span><br><span class="line">            &#125; </span><br><span class="line">            res += cr[i] + <span class="string">&#x27;0&#x27;</span>;</span><br><span class="line">        &#125;</span><br><span class="line">	&#125;</span><br><span class="line">	<span class="keyword">if</span>(f == <span class="number">0</span>)<span class="keyword">return</span> <span class="string">&quot;0&quot;</span>;</span><br><span class="line">	<span class="keyword">return</span> res;</span><br><span class="line">&#125;</span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span></span>&#123;</span><br><span class="line">	string a,b,res = <span class="string">&quot;0&quot;</span>;</span><br><span class="line">	cin &gt;&gt; a &gt;&gt; b;</span><br><span class="line">	<span class="keyword">for</span>(<span class="type">int</span> i = <span class="number">0</span>;i&lt;b.<span class="built_in">size</span>();i++)&#123;</span><br><span class="line">		string c = <span class="built_in">smallMulti</span>(a,b[i]-<span class="string">&#x27;0&#x27;</span>);</span><br><span class="line">		<span class="keyword">for</span>(<span class="type">int</span> j = <span class="number">0</span>;j&lt;b.<span class="built_in">size</span>()<span class="number">-1</span>-i;j++)</span><br><span class="line">			c += <span class="string">&#x27;0&#x27;</span>;</span><br><span class="line">		res = <span class="built_in">bigAdd</span>(res,c);</span><br><span class="line">	&#125;</span><br><span class="line">	cout &lt;&lt; res;</span><br><span class="line">	<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
